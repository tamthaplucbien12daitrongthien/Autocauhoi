name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Giai nen zip
        run: |
          ls -la
          unzip -oq ./*.zip
          ls -R autocalc | head -50
      - name: Kiem tra ma nguon
        run: test -f autocalc/src/main/java/com/autocalc/Solver.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - name: Build
        run: gradle build
        working-directory: autocalc
      - name: Kiem tra jar
        run: |
          ls -l autocalc/build/libs
          for j in autocalc/build/libs/*.jar; do unzip -l "$j" | tail -15; done
      - uses: actions/upload-artifact@v4
        with:
          name: autocalc-jar
          path: autocalc/build/libs/*.jar
